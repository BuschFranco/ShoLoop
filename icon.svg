<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Full-bleed square: Android's legacy (non-adaptive) icon pipeline generates both a square and
       a round launcher icon from this same source, cropping the round one itself — a background
       that already stops short of the edges would leave a colour mismatch behind the crop, so this
       fills the whole canvas rather than being inset or rounded here. -->
  <rect width="128" height="128" fill="#0b0614"/>
  <!-- Same dart/chevron silhouette as the player's own ship (Assets/Sprites/Characters/ship.svg),
       just pointed nose-up instead of nose-right — this is the game's own mark, not a stock glyph.
       The magenta layer behind it is a flat-shape stand-in for a glow (no <filter> blur, so it
       rasterizes identically everywhere Godot's icon pipeline runs) — same two-colour language as
       the arena itself: cyan is the player, magenta is everything trying to kill them. -->
  <polygon points="64,8 106,98 64,78 22,98" fill="#ff4fd8" opacity="0.3"/>
  <polygon points="64,18 92,90 64,72 36,90" fill="#7dfdfe"/>
</svg>
